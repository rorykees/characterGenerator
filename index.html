<!-- meta data -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Generator</title>
    <!-- bootstrap link -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <!-- css link -->
    <link rel="stylesheet" href="style.css">
</head>
<!-- page content -->
<body>

    <div class="container rounded">

        <!-- welcome section -->
        <div class="row">
            <section id="begin-page" class="col-sm-12">
                <h1>Character Generator</h1>
                <p>Generate a random NPC or player character from our D&D Campaigns</p>
            </section>
        </div>

        <!-- all characters -->
        <div class="row">
            <section class="col-sm-12 generator" data-pool="all">
                <button type="button" class="btn btn-primary">Generate from all campaigns</button>
                <h1 class="character-name"></h1>
                <h5 class="campaign-heading"></h5>
                <ul class="campaign-list"></ul>
            </section>
        </div>

        <!-- player characters -->
        <div class="row">
            <section class="col-sm-12 generator" data-pool="players">
                <button type="button" class="btn btn-primary">Generate from all player characters</button>
                <h1 class="character-name"></h1>
                <h5 class="campaign-heading"></h5>
                <ul class="campaign-list"></ul>
            </section>
        </div>

        <!-- one section per campaign is generated here by script.js from characters.js -->
        <div id="campaign-generators"></div>

    </div>

    <!-- js: characters.js is generated by sync/sync.js and must load first -->
    <script src="characters.js"></script>
    <script src="script.js"></script>
</body>
</html>
