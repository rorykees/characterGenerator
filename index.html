<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Generator</title>
    <meta name="description" content="Draw a random character from our tabletop campaigns.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <header class="masthead">
            <h1>Character Generator</h1>
            <p>Draw a random character from our campaigns.</p>
        </header>

        <!-- the draw: parchment card, then the draw button -->
        <section class="stage" aria-label="Drawn character">
            <article class="card" id="card" aria-live="polite">
                <p class="card-empty" id="card-empty">Press Draw to pull a character from the box.</p>
                <h2 class="card-name" id="card-name"></h2>
                <p class="card-status" id="card-status"></p>
                <figure class="card-portrait" id="card-portrait" hidden>
                    <img id="card-portrait-image" alt="" width="240" height="240">
                </figure>
                <ul class="card-campaigns" id="card-campaigns"></ul>
            </article>
        </section>

        <div class="draw-row">
            <button type="button" class="draw" id="draw">Draw a character</button>
            <p class="pool-size" id="pool-size"></p>
        </div>

        <!-- filters -->
        <form class="filters" id="filters">
            <fieldset class="filter">
                <legend>Who</legend>
                <div class="chips" id="who-chips">
                    <label class="chip"><input type="radio" name="who" value="anyone" checked><span>Anyone</span></label>
                    <label class="chip"><input type="radio" name="who" value="players"><span>Player characters</span></label>
                    <label class="chip"><input type="radio" name="who" value="npcs"><span>NPCs</span></label>
                </div>
            </fieldset>

            <fieldset class="filter">
                <legend>From</legend>
                <p class="filter-hint">Pick one or more campaigns, or leave them all unticked to draw from everything.</p>
                <div class="chips" id="campaign-chips"></div>
                <button type="button" class="clear" id="clear-campaigns" hidden>Clear campaigns</button>
            </fieldset>
        </form>

        <footer class="colophon">
            <p id="colophon-text"></p>
        </footer>

    </main>

    <!-- characters.js is generated by sync/sync.js and must load first -->
    <script src="characters.js"></script>
    <script src="script.js"></script>
</body>
</html>
